# 沐晴 · GitHub Actions 构建流程
# 用法：仓库 .github/workflows/main.yml（若已有同名文件，直接全选覆盖，不要新建第二个）
# 配套：仓库根只传一个 muqing-src*.zip，网页端不用解、不用建目录。
name: Build 沐晴 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 防循环：下面「回传 APK」那步自己会 push 一次，别让 bot 触发的 push 再跑一遍
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      # v5 / v5 / v6 均为 Node 24 原生，不再有 Node20 弃用警告
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 网页端只上传了一个 zip，所有深层目录在这里一次性还原。
      # 包里是完整工程（含 docs/、README、.gitignore），不含 .github/workflows/
      # —— 否则 unzip -o 会把你刚粘好的这份 workflow 覆盖回旧版。
      - name: 解压工程
        run: |
          set -e
          # 网页端/手机下载常把文件名改成 muqing-src-1.zip、muqing-src (1).zip。
          # 优先认精确名，否则自动挑一个 muqing-src*.zip —— 不再因后缀挂掉。
          Z="muqing-src.zip"
          if [ ! -f "$Z" ]; then
            Z=$(ls -1 muqing-src*.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$Z" ] || [ ! -f "$Z" ]; then
            echo "::error::仓库根找不到 muqing-src*.zip"
            exit 1
          fi
          unzip -qo "$Z"
          chmod +x gradlew || true
          echo "解压完成: $Z"

      - name: 目录自检
        run: |
          set -e
          for f in settings.gradle build.gradle gradle.properties gradlew \
            gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties \
            app/build.gradle app/src/main/AndroidManifest.xml \
            app/src/main/java/com/muqing/core/MuQing.java \
            app/src/main/java/com/muqing/android/MainActivity.java \
            app/src/main/java/com/muqing/android/SettingsActivity.java \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout/activity_settings.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/res/drawable/black.png \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            tools/CoreTest.java; do
            [ -f "$f" ] || { echo "::error::缺少文件: $f"; exit 1; }
          done
          python3 -c "import zipfile; assert any('GradleWrapperMain' in x for x in zipfile.ZipFile('gradle/wrapper/gradle-wrapper.jar').namelist())"
          echo "自检通过"

      - name: 引擎自测（纯 Java）
        run: |
          set -e
          mkdir -p /tmp/c
          javac -encoding UTF-8 -d /tmp/c \
            app/src/main/java/com/muqing/core/*.java \
            tools/CoreTest.java
          java -cp /tmp/c com.muqing.core.CoreTest

      - name: 确保 Android SDK 34
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: 构建 debug APK
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: muqing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "沐晴 APK #${{ github.run_number }}" \
            --notes "自动构建，debug 签名。"
          echo "已发布 $TAG"

      # 把 APK 放回仓库根，得到一条不需要登录、不会过期的静态直链。
      # 只 add 这一个文件：.gitignore 里有 *.apk，必须 -f；
      # 解压出来的工程文件不重复提交。
      - name: 回传 APK 到仓库
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk ./muqing-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f muqing-debug.apk
          git diff --cached --quiet && { echo "APK 无变化，跳过提交"; exit 0; } || true
          git commit -m "chore: 发布 APK [skip ci]"
          git push
          echo "静态直链已就绪"
